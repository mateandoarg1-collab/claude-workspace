name: Métricas Empretienda

# Lee Métricas de Empretienda (hoy / semana / mes) y actualiza la planilla que muestra /canales,
# sin depender de la Mac. Ver scripts/empretienda-metricas.mjs.
on:
  schedule:
    # minutos "raros": GitHub demora o saltea los crons en punto (:00 / :30) cuando hay mucha demanda
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: empretienda-metricas
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --no-save --no-audit --no-fund googleapis playwright
          npx playwright install --with-deps chromium

      # sesión renovada (cifrada) que dejó la corrida anterior
      - uses: actions/cache/restore@v4
        with:
          path: .sesion.enc
          key: empretienda-sesion-${{ github.run_id }}
          restore-keys: empretienda-sesion-

      - name: Leer Métricas y actualizar planilla
        run: node scripts/empretienda-metricas.mjs
        env:
          EMPRETIENDA_STATE: ${{ secrets.EMPRETIENDA_STATE }}
          EMPRETIENDA_KEY: ${{ secrets.EMPRETIENDA_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - uses: actions/cache/save@v4
        with:
          path: .sesion.enc
          key: empretienda-sesion-${{ github.run_id }}
